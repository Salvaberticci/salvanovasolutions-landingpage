<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delicious | Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin-styles.css">
</head>

<body class="admin-login-body">
    <div class="login-container">
        <div class="login-split-card fade-in">
            <!-- Branding Side (Left/Red) -->
            <div class="login-aside">
                <div class="aside-branding">
                    <img src="../assets/images/logo.png" alt="Delicious Logo" class="admin-login-logo">
                    <div class="aside-text">
                        <h2>Delicious Industrial</h2>
                        <p>Cerebro Operativo v2.0</p>
                    </div>
                </div>
            </div>

            <!-- Form Side (Right/White) -->
            <div class="login-main">
                <div class="login-header">
                    <h1>Bienvenido de nuevo</h1>
                    <p>Por favor, ingresa tus credenciales de seguridad para acceder al panel administrativo.</p>
                </div>

                <form id="adminLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Identificador de Usuario</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user-shield"></i>
                            <input type="text" id="username" class="form-input" placeholder="Nombre de usuario"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Clave de Seguridad</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Autenticar y Acceder <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>

                <div class="login-footer">
                    <p>&copy; 2026 Delicious Agroindustrias De Sabores C.A.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/admin.js"></script>
</body>

</html>
